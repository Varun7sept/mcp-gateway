# MCP Gateway Configuration
# 8 servers with 20+ real tools

gateway:
  port: 8080
  name: "MCP Gateway"

mongodb:
  uri: ""  # Set MONGO_URI env var in production
  database: "mcp_gateway"

memory:
  retrieval_top_k: 5
  embedding_model: "llama-3.3-70b-versatile"
  qdrant_url: "http://localhost:6333"
  qdrant_collection: "mcp_memories"
  qdrant_api_key: ""
  mongodb_memory_collection: "memories"
  groq_api_key: ""

conversation:
  recent_message_window: 20
  conversation_summary_message_threshold: 20
  conversation_summary_token_threshold: 8000
  mongodb_chat_collection: "chat_sessions"

servers:
  - name: "weather"
    url: "http://localhost:3001"
    enabled: true

  - name: "notes"
    url: "http://localhost:3002"
    enabled: true

  - name: "github"
    url: "http://localhost:3003"
    enabled: true

  - name: "crypto"
    url: "http://localhost:3004"
    enabled: true

  - name: "news"
    url: "http://localhost:3005"
    enabled: true

  - name: "url-tools"
    url: "http://localhost:3006"
    enabled: true

  - name: "search"
    url: "http://localhost:3007"
    enabled: true

  - name: "documents"
    url: "http://localhost:3008"
    enabled: true
